services:
  linux-x11-sandbox:
    build: .
    container_name: linux-x11-sandbox
    # Run the long-lived daemon; agents exec in with `linux-x11-sandbox mcp`.
    command: ["serve"]
    environment:
      - DISPLAY=:99
    # Share host IPC for better X11/Shm performance (optional).
    ipc: host
    # No ports exposed; MCP uses stdio via docker exec.
