services:
  linux-x11-sandbox:
    build: .
    container_name: linux-x11-sandbox
    # Keep the container running so agents can exec into it.
    command: ["sleep", "infinity"]
    environment:
      - DISPLAY=:99
    # Share host IPC for better X11/Shm performance (optional).
    ipc: host
    # No ports exposed; MCP uses stdio via docker exec.
