[workspace]
members = ["lxs/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wangxiaoxiaoa/linux-x11-sandbox"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-std"] }
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13", features = ["xtest"] }
x11 = { version = "2.21", features = ["xtest"] }
x11-keysymdef = "0.2"
base64 = "0.22"
atspi = { version = "0.30", features = ["tokio"] }

lxs-core = { path = "lxs/core" }
lxs-action = { path = "lxs/action" }
lxs-state = { path = "lxs/state" }
lxs-driver = { path = "lxs/driver" }
lxs-runtime = { path = "lxs/runtime" }
lxs-mcp = { path = "lxs/mcp" }
