[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wangxiaoxiaoa/linux-x11-sandbox"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11 = { version = "2", features = ["xtest"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

lxs-core = { path = "crates/lxs-core" }
lxs-action = { path = "crates/lxs-action" }
lxs-state = { path = "crates/lxs-state" }
lxs-driver = { path = "crates/lxs-driver" }
lxs-runtime = { path = "crates/lxs-runtime" }
lxs-mcp = { path = "crates/lxs-mcp" }
